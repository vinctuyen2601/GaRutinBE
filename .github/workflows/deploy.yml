name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Dừng ngay khi một lệnh lỗi. Không có dòng này thì migration
            # hỏng vẫn đi tiếp tới pm2 restart và máy chủ chạy với schema
            # sai — đúng sự cố khi thêm cột products.video_url.
            set -e
            export PATH=/home/ubuntu/.nvm/versions/node/v23.11.1/bin:$PATH
            cd GaRutinBE
            # KHÔNG dùng `git pull`. Máy chủ có thể có thay đổi cục bộ ở tệp
            # được theo dõi — package-lock.json là trường hợp thật, nó bị sửa
            # trên máy chủ từ lúc nào không rõ. `git pull` khi đó từ chối ghi
            # đè và deploy chết ở bước đầu với thông báo "Your local changes
            # would be overwritten by merge".
            #
            # Kiểu hỏng này ÂM THẦM: mọi commit không đụng tệp đó vẫn deploy
            # bình thường, nên nó nằm im cho tới đúng lần thêm một gói mới.
            # Ngày 15/09/2026 mất mười phút đoán mò vì chuyện này.
            #
            # `fetch` + `reset --hard` làm máy chủ luôn khớp đúng kho mã, không
            # phụ thuộc trạng thái cũ. An toàn ở đây vì .env nằm ngoài git và
            # `reset --hard` không đụng tệp chưa được theo dõi.
            git fetch origin main
            git reset --hard origin/main
            rm -f tsconfig.build.tsbuildinfo
            rm -rf node_modules
            npm ci
            npm run build
            # Migration chạy TRƯỚC khi khởi động lại, không phải sau.
            # Thứ tự này an toàn một chiều: schema mới + mã cũ thì mã cũ
            # chỉ bỏ qua cột mới; ngược lại — mã mới + schema cũ — API chết.
            #
            # Dùng bản đã biên dịch chứ không dùng migration:run: lệnh đó
            # cần ts-node, mà ts-node ở devDependencies nên không chắc có.
            npm run migration:run:prod
            pm2 restart garutin-be
            pm2 save
            sleep 3
            echo "=== PM2 STATUS ==="
            pm2 show garutin-be
            echo "=== LAST 30 LINES LOG ==="
            pm2 logs garutin-be --lines 30 --nostream

      # Deploy hỏng thì phải BIẾT NGAY, không phải phát hiện sau khi ngồi đoán
      # vì sao mã mới không lên. Ngày 15/09/2026 mất mười phút truy chuyện đó:
      # API vẫn trả 200 nên trông như bình thường, chỉ là đang chạy mã cũ.
      #
      # `if: failure()` nên bước này chỉ chạy khi có bước trước đó hỏng.
      # Thiếu secret thì bỏ qua im lặng — không làm đỏ thêm một lần chạy vốn
      # đã đỏ, và không lộ chuyện thiếu cấu hình ra log công khai.
      - name: Bao Telegram khi deploy hong
        if: failure()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "Chua dat TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID, bo qua buoc bao."
            exit 0
          fi
          TIN="🔴 DEPLOY HỎNG — ${{ github.repository }}
          commit: ${{ github.sha }}
          $(echo '${{ github.event.head_commit.message }}' | head -1)
          Xem: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=$TIN" > /dev/null || true
